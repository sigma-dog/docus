services:
    postgres:
        image: postgres:17-alpine
        container_name: docus_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: docus
            POSTGRES_PASSWORD: docus_secret
            POSTGRES_DB: docus
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
